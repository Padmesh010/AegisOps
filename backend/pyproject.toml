[tool.poetry]
name = "aegisops-backend"
version = "1.0.0"
description = "AegisOps AI-Powered DevOps Platform Core Backend"
authors = ["AegisOps Architecture Team <arch@aegisops.io>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = {extras = ["email"], version = "^2.10.0"}
pydantic-settings = "^2.7.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = {extras = ["hiredis"], version = "^5.0.0"}
pyjwt = {extras = ["crypto"], version = "^2.10.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
cryptography = "^43.0.0"
httpx = "^0.27.0"
python-multipart = "^0.0.12"
prometheus-client = "^0.21.0"
psutil = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
anyio = "^4.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic"]
