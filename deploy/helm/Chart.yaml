apiVersion: v2
name: aegisops
description: A production-ready Helm chart for the AegisOps AI operations platform.
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: postgresql
    version: 12.5.6
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.13.2
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
