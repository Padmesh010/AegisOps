replicaCount: 3

image:
  repository: aegisops/backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.aegisops.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aegisops-tls
      hosts:
        - api.aegisops.io

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

postgresql:
  enabled: true
  auth:
    database: aegisops
    username: admin
    password: securepassword

redis:
  enabled: true
  auth:
    password: secureredispassword
