apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegisops-backend-policy
spec:
  podSelector:
    matchLabels:
      app: aegisops-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Ingress Controller connection
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow egress to PostgreSQL DB and Redis Pods only
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
