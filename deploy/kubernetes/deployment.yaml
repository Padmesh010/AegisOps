apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-backend
  labels:
    app: aegisops-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisops-backend
  template:
    metadata:
      labels:
        app: aegisops-backend
    spec:
      containers:
      - name: backend
        image: aegisops/backend:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        readinessProbe:
          httpGet:
            path: /api/v1/health/readiness
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health/liveness
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
